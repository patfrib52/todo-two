<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="./todo.js" defer></script>
    <title>Todo-Two</title>
  </head>
  <body>
    <div class="input-group">
      <label for="userProjectInput">Project</label>
      <input
        type="text"
        id="userProjectInput"
        placeholder="Your Project Here"
      />
      <button type="submit" id="addProjectBtn">Add Project</button>
    </div>

    <p>Projects</p>
    <hr class="short-broken-line" />
    <div id="display-projects"></div>

    <p>Active Project:</p>
    <hr class="short-broken-line" />
    <div id="display-active-projects"></div>

    <p>Todo</p>
    <hr class="short-broken-line" />
    <div class="button-stack" id="display-todo"></div>

    <p>Add Todo</p>
    <hr class="short-broken-line" />
    <div id="display-todo-input"></div>
  </body>
</html>
